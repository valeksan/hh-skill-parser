[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-skill-parser"
version = "1.0.0"
description = "Collect HH.ru vacancies into SQLite and export reproducible skill research data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Vitaliy" },
  { name = "Mark" }
]
dependencies = [
    "requests>=2.25.1",
    "beautifulsoup4>=4.10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
parquet = [
  "pyarrow>=14",
]

[project.scripts]
hh-skill-parser = "hh_parser.cli:main"

[tool.setuptools.packages.find]
include = ["hh_parser*"]

[tool.setuptools.package-data]
hh_parser = ["migrations/*.sql"]
